
services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks_dev
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - task-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d tasks_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: task-api:local

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/tasks_dev
      DB_USER: taskuser
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - task-network

    restart: unless-stopped

volumes:
  postgres_data:

networks:
  task-network:
    driver: bridge
