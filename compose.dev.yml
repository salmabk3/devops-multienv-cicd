services:
  db:
    image: postgres:17-alpine
    container_name: task-postgres-dev

    environment:
      POSTGRES_DB: tasks_dev
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d tasks_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data: